<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Owner Dashboard | Janta Gadi</title><link rel="stylesheet" href="/admin.css"></head><body><main class="wrap"><a href="/" class="back">← View website</a><section class="panel" id="loginPanel"><h1>Owner login</h1><p>Sign in to update your business website.</p><form id="loginForm"><label>Username<input name="username" required value="owner"></label><label>Password<input name="password" type="password" required></label><button>Sign in</button><p class="message" id="loginMessage"></p></form></section><section class="panel hidden" id="dashboard"><div class="head"><div><h1>Website editor</h1><p>Changes appear on your public website after saving.</p></div><button class="secondary" id="logout">Log out</button></div><form id="siteForm"><div class="fields"><label>Business name<input name="businessName"></label><label>Location<input name="location"></label><label>Phone number<input name="phone"></label><label>WhatsApp number<input name="whatsapp" placeholder="9199XXXXXXXX"></label><label class="wide">Short introduction<textarea name="intro" rows="3"></textarea></label><label class="wide">About your workshop<textarea name="about" rows="3"></textarea></label><label class="wide">Full address<input name="address"></label><label class="wide">Working hours<input name="hours"></label></div><h2>Services</h2><div id="serviceFields"></div><button type="submit">Save website changes</button><p class="message" id="saveMessage"></p></form><hr><h2>Change admin password</h2><form id="passwordForm"><div class="fields"><label>Current password<input name="currentPassword" type="password" required></label><label>New password (at least 14 characters)<input name="newPassword" type="password" minlength="14" required></label></div><button>Change password</button><p class="message" id="passwordMessage"></p></form></section></main><script src="/admin.js" defer></script></body></html>
